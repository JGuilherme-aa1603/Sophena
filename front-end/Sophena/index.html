<!DOCTYPE html>
<html lang="pt-BR" data-theme="green" data-appearance="light">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sophena</title>
</head>

<body>
  <div id="app"></div>
  <script>
    (function () {
      var defaultPreferences = {
        accentColor: 'green',
        appearance: 'light',
      }

      try {
        var savedValue = localStorage.getItem('sophena:theme-preferences')
        var savedPreferences = savedValue ? JSON.parse(savedValue) : defaultPreferences
        var isValidAccent = savedPreferences.accentColor === 'green' || savedPreferences.accentColor === 'purple'
        var isValidAppearance = savedPreferences.appearance === 'light' || savedPreferences.appearance === 'dark'
        var preferences = isValidAccent && isValidAppearance ? savedPreferences : defaultPreferences

        document.documentElement.dataset.theme = preferences.accentColor
        document.documentElement.dataset.appearance = preferences.appearance
      } catch (_error) {
        document.documentElement.dataset.theme = defaultPreferences.accentColor
        document.documentElement.dataset.appearance = defaultPreferences.appearance
      }
    })()
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
